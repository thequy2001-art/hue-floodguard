name: Tu dong canh muc nuoc & Bao dong lu

on:
  schedule:
    # Tự động chạy mỗi 5 phút một lần (24/7)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" thủ công trên GitHub để test bất cứ lúc nào

jobs:
  check-flood:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chay kiem tra muc nuoc va ban canh bao
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node check-flood.js
